<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCorp - Admin Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at top, #0d1117 0%, #010409 100%);
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(48, 54, 61, 0.6);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #58a6ff;
        }

        .logo p {
            font-size: 0.8rem;
            opacity: 0.5;
            margin-top: 0.3rem;
        }

        .field {
            margin-bottom: 1rem;
        }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: #8b949e;
        }

        .field input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input:focus {
            border-color: #58a6ff;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            background: #238636;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2ea043;
        }

        .msg {
            margin-top: 1rem;
            padding: 0.7rem;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
        }

        .msg.error   { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
        .msg.success { background: rgba(35, 134, 54, 0.15); color: #3fb950; border: 1px solid rgba(35, 134, 54, 0.3); }
        .msg.flag    { background: rgba(88, 166, 255, 0.1); color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.3); font-family: monospace; word-break: break-all; }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.65rem;
            opacity: 0.35;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>SecureCorp</h1>
            <p>Internal Administration Portal</p>
        </div>

        <form method="POST" action="/">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your ID" required autocomplete="off">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required>
            </div>
            <button type="submit">Authenticate</button>
        </form>

        {% if error %}
        <div class="msg error">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div class="msg success">{{ message }}</div>
        {% endif %}

        {% if flag %}
        <div class="msg success">Welcome, {{ user }}! You have admin access.</div>
        <div class="msg flag">🚩 {{ flag }}</div>
        {% endif %}

        <div class="footer">&copy; 2026 SecureCorp Defence Systems. All rights reserved.</div>
    </div>
</body>
</html>
