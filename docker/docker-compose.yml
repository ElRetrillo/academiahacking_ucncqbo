services:
  web-001:
    build:
      context: ./challenge-web-001
      args:
        CHALLENGE_FLAG: ${FLAG_WEB_001:-EclipSec{h1dd3n_1n_pl41n_s1ght}}
    container_name: ctf-web-001
    restart: unless-stopped
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 32
    ports:
      - "8001:8080"
    networks:
      - ctf-net

  web-002:
